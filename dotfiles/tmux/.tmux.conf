# 2026-05-01 
# source /home/donagh/Arch_PORTABLE_ENV/ricing/warm-burnout/tmux/warm-burnout-dark.conf

# Use zsh as default
set -g default-shell /usr/sbin/zsh

# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "screen-256color" # Set terminal type for 256-color support
set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-color for compatible terminals


# tmux config file at $HOME/.tmux.conf
unbind r
bind r source-file $HOME/.tmux.conf
# usage: inside tmux C-a r will reload the config file.
 
# 2026-07-04 
# REVERTED TO Ctrl a
# NOTE: I am experimenting with using a single command to ssh & tmuxp load from LenManjaro into the Toshiba so this means
# not having the sam prefix on the local and the remote.
# /usr/sbin/ssh -i /home/donagh/.ssh/id_ed_Toshiba donagh@19j.168.1.86 -t tmuxp load -y ~/.tmuxp/my-6-daily-tabs.yaml || tmux new --▷ sshm() in .zsh_aliases

# Send prefix rebind - change the default from B to A
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix

 # On your local machine's ~/.tmux.conf
# set -g prefix C-b
# unbind C-a
# bind C-b send-prefix

# On the remote machine's ~/.tmux.conf
# Keep the default Ctrl+b prefix

# Mouse mode
set -g mouse on

# display-popup
# example
# Ctrl a : display-popup  -w 80% -h 80% -E btop
# from https://www.youtube.com/watch?v=7BP9iWiKx8Q -- see zim-wiki MAJORS:tmux:display-popup
bind -n M-t display-popup -d "#{pane-current-path}" -E "zsh"


# use vim Alt- h,j,k,l to navigate panes
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Use vim arrow keys to resize pane
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# make the windows start by the index 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# if you delete a window, keep a list of contiguous numbers
set-option -g renumber-windows on

# Set easier window split
bind-key v split-window -h
bind-key h split-window -v


# Swapping windows is swapping tabs


# Swap pane positions
# Prefix : to open the command line
# Use Prefix q to get the 'numbers' of each pane
# swap-pane -s1 -t2

# Set easier swap window positions
bind -r ">" swap-pane -d -t +1
bind -r "<" swap-pane -d -t -1



# vim keys in copy and choose mode
set-window-option -g mode-keys vi
bind-key Escape copy-mode
bind-key p paste-buffer
bind-key P choose-buffer
bind-key + delete-buffer \; display-message "Deleted current Tmux Clipboard History" 
bind-key -T copy-mode-vi y send-keys -X copy-pipe "clipit -in - selection clipboard"

# Styling

# Colours
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
purple1="#df0d68"
purple2="#660066"
nice_green="#336600"



# tmux status bar on top
set -g status-position top

# style the status bar
set -g status-left-length 100
set -g status-style "fg=${gray_light},bg=default"
set -g status-left "#[fg=${green_soft},bold]  "LenManjaro"  #[fg=${gray_light},nobold] | "
# set -g window-status-format "#[fg=${cyan_soft}, bold] #W #[fg=#0000ff,bg=orange] #I #[fg=orange,bg=default]"
set -g window-status-format "#[fg=#0000ff,bg=orange] #I #[fg=orange,bg=default]#[fg=${cyan_soft}, bold]#W#[fg=orange,bg=default]"
# set -g window-status-current-format "#[fg=red, bold]  #W-#I"
# set -g window-status-current-format "#[fg=red, bold]  #W #[fg=#0000ff,bg=orange] #I #[fg=orange,bg=default]"
# set -g window-status-current-format "#[fg=red, bold]  #W #[fg=#0000ff,bg=orange] #I #[fg=orange,bg=default]"
# set -g window-status-current-format "#[fg=red, bold]  #W #[fg=#0000ff,bg=orange] #I #[fg=orange,bg=default]"
# set -g window-status-current-format "#[fg=red, bold]  #W #[fg=#0000ff,bg=orange]#I  #[fg=orange,bg=default]"
set -g window-status-current-format "#[fg=#0000ff,bg=red] #I #[fg=yellow,bg=default] #[fg=red, bold]#W"

